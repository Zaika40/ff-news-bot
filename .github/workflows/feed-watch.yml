name: Feed watch

# The Cloudflare worker (worker.js) watches these feeds every minute now, so the
# 5-minute schedule here is off to stop double posts. Run it by hand from the
# Actions tab if the worker is ever down.
on:
  workflow_dispatch:

permissions:
  contents: write  # so it can save what it has already posted

concurrency:
  group: feed-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the feeds
        env:
          # One channel for both feeds: set DISCORD_NEWS_WEBHOOK only.
          # Separate channels: set the two below instead, they win.
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          DISCORD_TRUMP_WEBHOOK: ${{ secrets.DISCORD_TRUMP_WEBHOOK }}
          DISCORD_HEADLINES_WEBHOOK: ${{ secrets.DISCORD_HEADLINES_WEBHOOK }}
          MAX_PER_RUN: "8"  # most posts per check, so a backlog can't flood the channel
        run: python3 feed_watch.py

      - name: Remember what it posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "state: feeds [skip ci]"
            git pull --rebase --autostash
            git push
          fi
