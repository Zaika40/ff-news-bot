name: Calendar snapshot

# Grabs the Forex Factory week into data/calendar.json, which the Cloudflare
# worker reads. Forex Factory blocks Cloudflare's shared IPs, GitHub's runners
# it allows. The feed covers Sun–Sat, so one good run a day is plenty and a
# missed run costs nothing.

on:
  schedule:
    - cron: "23 */2 * * *"  # every 2 hours — GitHub drops scheduled runs, so give it plenty of chances
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download the calendar
        run: python3 snapshot_calendar.py

      - name: Commit it
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "calendar snapshot [skip ci]"
            git pull --rebase --autostash
            git push
          fi
