name: FF News

on:
  schedule:
    # GitHub runs cron on UTC, so each post has one line for summer time (EDT)
    # and one for winter time (EST). The script skips whichever line doesn't
    # match today's clock, starts 10 min early and waits for the exact time.
    # If you change these, update SCHEDULES in ff_news.py to match.
    - cron: "50 10 * * 1-5"  # weekdays 7:00 AM ET, today's news (EDT)
    - cron: "50 11 * * 1-5"  # weekdays 7:00 AM ET, today's news (EST)
    - cron: "20 13 * * 1-5"  # weekdays 9:30 AM ET, NY open ping (EDT)
    - cron: "20 14 * * 1-5"  # weekdays 9:30 AM ET, NY open ping (EST)
    - cron: "50 20 * * 0"    # Sundays 5:00 PM ET, week ahead (EDT)
    - cron: "50 21 * * 0"    # Sundays 5:00 PM ET, week ahead (EST)
  workflow_dispatch:
    inputs:
      post:
        description: "Which post to send right now"
        type: choice
        options: [week, morning, open]
        default: week

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_POST: ${{ inputs.post }}
          # Your settings:
          CURRENCIES: "USD"          # e.g. "USD,EUR"
          IMPACTS: "High,Medium"     # High = red folder, Medium = orange
          SESSION: "09:30-11:00"     # your trading window, ET
          OPEN_PING: "@everyone"     # who the 9:30 post pings; "" = no ping
          SPEAKERS: "FOMC,Fed Chair,Fed Gov,Treasury Sec"  # always included, whatever the folder color
          GLOBAL_IMPACTS: "High"     # other currencies, shown in the overnight block; "" = skip it
          OVERNIGHT_FROM: "17:00"    # overnight block starts here the evening before, ET
        run: python3 ff_news.py
